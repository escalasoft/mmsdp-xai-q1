[project]
name = "mmsdp-xai"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.4.6",
  "pandas==2.2.3",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "xgboost==3.2.0",
  "lightgbm==4.6.0",
]
dynamic = ["version"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
